image: node:18

stages:
  - install
  - lint
  - test

cache:
  paths:
    - node_modules/

install:
  stage: install
  script:
    - npm ci || npm install
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

lint:
  stage: lint
  script:
    - npm run lint || echo "No linter configured"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never

test:
  stage: test
  script:
    - echo "No tests yet, but pipeline works!"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
    - when: never
